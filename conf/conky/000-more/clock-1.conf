-- Required fonts
--    LCARS
--    Tw Cen MT, 
--
-- Conky hints:
--    https://conky.sourceforge.net/variables.html
--    https://forum.manjaro.org/t/conky-own-window-transparent-not-working-black-background/129414
--
-- CPU name:
--    cat /proc/cpuinfo | grep 'model name' | sed -e 's/model name.*: //'| uniq
-- Available updates count:
--    Updates:${execi 600 apt list --upgradable | wc -l}

conky.config = {
-- template9 = "ca_ES.UTF-8",
   update_interval = 1.0,

   output_backend = 'x11',
-- xinerama_head = 0, -- Monitor
   alignment = 'top_right',   -- {top|middle|bottom}_right
   gap_x = -2540,
   gap_y = 20,

   font = 'Tw Cen MT:size=16',
   use_xft = true,
   minimum_width = 256, -- I'd like to be able to put this into ***graph.
   maximum_width = 256,

   double_buffer = true,
   own_window = true,
   own_window_class = 'Conky',
   own_window_type = 'desktop',
   own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
   own_window_color = '20000000',

   border_width = 8,
   draw_borders = false,
   draw_outline = true,
   draw_shades = false,
   draw_graph_borders = false,
   show_graph_range = false,
   show_graph_scale = false,
   short_units = true,

   default_color = 'ff00ff',
   default_outline_color = black,
   default_shade_color = black,

   color1 = '405870', -- visual elements darkened
   color2 = '8495af', -- visual elements normal
   color3 = '8495af', -- text normal
   color4 = 'd7e7e7', -- text highlighted
   color5 = '405870', -- text darkened
}

conky.text = [[
${voffset -16}${font LCARS:size=80}$color4${time %H}${offset 2}$color3${font LCARS:size=48}${time %M}$font \
${voffset 8}${font Tw Cen MT:size=25}$alignr${voffset -70}$color4${time %A}
${font LCARS:size=36}$alignr$color4${time %d} $color3${time %m} $color5${time %y}
]]
