-- Required fonts
--    LCARS
--    Tw Cen MT, 
--
-- Conky hints:
--    https://conky.sourceforge.net/variables.html
--    https://forum.manjaro.org/t/conky-own-window-transparent-not-working-black-background/129414
--
-- CPU name:
--    cat /proc/cpuinfo | grep 'model name' | sed -e 's/model name.*: //'| uniq
-- Available updates count:
--    Updates:${execi 600 apt list --upgradable | wc -l}

conky.config = {
-- template9 = "ca_ES.UTF-8",
   update_interval = 1.0,

   alignment = 'top_right',   -- {top|middle|bottom}_right
   gap_x = 30,
   gap_y = 60,
--   xinerama_head = 2, -- Monitor (?)

   font = 'Tw Cen MT:size=16',
   use_xft = true,
   minimum_width = 256, -- I'd like to be able to put this into ***graph.
   maximum_width = 256,

   double_buffer = true,
   own_window = true,
   own_window_class = 'Conky',
   own_window_type = 'desktop',
   own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
   own_window_argb_visual = true,
   -- Window completely transparent:
      own_window_transparent = true,
   -- Window background:
      own_window_transparent = false,
      own_window_argb_value = 128,
   own_window_colour = '000000',

   border_width = 8,
   draw_borders = false,
   draw_outline = true,
   draw_shades = false,
   draw_graph_borders = false, --  <--
   show_graph_range = false,
   show_graph_scale = false,
   short_units = true,

--   background = false,
--   cpu_avg_samples = 2,
--   extra_newline = false,
--   net_avg_samples = 2,
--   no_buffers = true,
--   out_to_console = false,
--   out_to_ncurses = false,
--   out_to_stderr = false,
--   out_to_x = true,
--   stippled_borders = 0,
--   uppercase = false,
--   use_spacer = 'none',

   default_color = 'ff00ff',
   default_outline_color = black,
   default_shade_color = black,

   color1 = 'c00000', -- visual elements normal
   color2 = '800000', -- visual elements darkened
   color3 = 'e00000', -- text normal
   color4 = 'FF6060', -- text highlighted
   color5 = 'b00000', -- text darkened
}

conky.text = [[
${voffset -16}${font LCARS:size=80}$color4${time %H}${offset 2}$color3${font LCARS:size=48}${time %M}$font${voffset 8}
${font Tw Cen MT:size=20}$alignr${voffset -96}$color4${time %A}
${font LCARS:size=20}$alignr$color4${time %d} $color3${time %m} $color5${time %y}
${font LCARS:size=20}$alignr$color4${lowercase $uptime}$font${voffset 8}
\
${if_match $battery_percent>0}\
${if_match $battery_percent<16}${color red}${else}${if_match $battery_percent<31}${color orange}${else}${if_match $battery_percent<51}${color yellow}${else}${color2}${endif}${endif}${endif}${battery_bar 21}
$color3${voffset -26}${offset 6}${color2}Battery $color4$battery_short$alignr${offset -6}$color4$battery_time
${else}\
${endif}\
\
${voffset 6}${color3}CPU $color4$cpu%${alignr}${color3}x$color4${execi 99999 nproc --all}
${voffset -30}$color1${cpugraph 48,256 E8BF28 red -t}
${voffset -14}${if_match $cpu<33}${color green}${else}${if_match $cpu<66}${color yellow}${else}${if_match $cpu<90}${color orange}${else}${color red}${endif}${endif}${endif}\
${goto 12}${cpubar 6}${goto 12}$color2${execbar echo 0}${voffset 8}
\
${color3}RAM $color4$memperc%${alignr}$mem$color3 / $memmax
${voffset -30}$color1${memgraph 48,256 E8BF28 red -t}
${voffset -14}${if_match $memperc<33}${color green}${else}${if_match $memperc<66}${color yellow}${else}${if_match $memperc<90}${color orange}${else}${color red}${endif}${endif}${endif}\
${goto 12}${membar 6}${goto 12}$color2${execbar echo 0}
\
${if_existing /dev/nvme0n1}\
\
${diskiograph /dev/nvme0n1 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /}<10}${color red}${else}${color2}${endif}${fs_bar 21 /}
$color3${voffset -26}${offset 6}System$alignr${offset -6}$color4${fs_free /}$color3 / ${fs_size /}
\
${else}\
\
${diskiograph /dev/sda 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /}<10}${color red}${else}${color2}${endif}${fs_bar 21 /}
$color3${voffset -26}${offset 6}System$alignr${offset -6}$color4${fs_free /}$color3 / ${fs_size /}
\
${if_existing /dev/sdb}\
${voffset 8}${diskiograph /dev/sdb 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /shared/videoteca}<10}${color red}${else}${color2}${endif}${fs_bar 21 /shared/videoteca}
$color3${voffset -26}${offset 6}Videoteca$alignr${offset -6}$color4${fs_free /shared/videoteca}$color3 / ${fs_size /shared/videoteca}
${endif}\
\
${if_existing /dev/sdc}\
${voffset 8}${diskiograph /dev/sdc 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /shared/filter}<10}${color red}${else}${color2}${endif}${fs_bar 21 /shared/filter}
$color3${voffset -26}${offset 6}Filter$alignr${offset -6}$color4${fs_free /shared/filter}$color3 / ${fs_size /shared/filter}
${endif}\
\
${if_existing /dev/sdd}\
${voffset 8}${diskiograph /dev/sdd 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /shared/temp}<10}${color red}${else}${color2}${endif}${fs_bar 21 /shared/temp}
$color3${voffset -26}${offset 6}Temp$alignr${offset -6}$color4${fs_free /shared/temp}$color3 / ${fs_size /shared/temp}
${endif}\
\
${if_existing /dev/sde}\
${voffset 8}${diskiograph /dev/sde 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /shared/temp2}<10}${color red}${else}${color2}${endif}${fs_bar 21 /shared/temp2}
$color3${voffset -26}${offset 6}Temp2$alignr${offset -6}$color4${fs_free /shared/temp2}$color3 / ${fs_size /shared/temp2}
${endif}\
\
${if_existing /dev/sdf}\
${voffset 8}${diskiograph /dev/sdf 48,256 E8BF28 red -t}
${voffset -8}${if_match ${fs_free_perc /shared/temp3}<10}${color red}${else}${color2}${endif}${fs_bar 21 /shared/temp3}
$color3${voffset -26}${offset 6}Temp3$alignr${offset -6}$color4${fs_free /shared/temp3}$color3 / ${fs_size /shared/temp3}
${endif}\
\
${endif}\
$hr
${alignc}${color4}${lowercase ${execi 99999 whoami}${color5}@$nodename}
${alignc}${color3}${execi 99999 hostname -I}
]]
